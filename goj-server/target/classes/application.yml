goj:
  judge:
    # 测试数据存放的跟目录, 用于构造测试数据路径
    data-root: /srv/goj-data
    sandbox-base-url: http://192.0.0.1:5050
    # 每个语言对应的环境, 目前只有java, 后续...
    languages:
      java11:
        javac: /usr/local/java/jdk11/bin/javac
        java:  /usr/local/java/jdk11/bin/java

server:
  port: 8080

spring:
  application:
    name: goj-server
  devtools:
    restart:
      enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/goj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 200610

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # 连接池最大阻塞等待时间
          max-wait: -1ms


# 日志配置
logging:
  level:
    com.gusl: debug
    org.springframework: warn


# mybatis-plus配置
mybatis-plus:
  configuration:
    # 开启驼峰映射
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl



# 配置 knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /**
      packages-to-scan:
        - com.gusl.gojserver.controller

security:
  token:
    # secret 从环境变量中读取
    secret: ${GOJ_JWT_SECRET}
    expire-minutes: 120
    redis-prefix: "login:token:"

# 阿里云OSS相关配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: gusl
