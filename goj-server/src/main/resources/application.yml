goj:
  judge:
    task:
      dispatch-interval-ms: 3000 # 扫描间隔 / ms
      max-attempts: 3  # 最大重试次数

  data-root: D:\ProgramData\goj-data  # 测试数据存放的跟目录, 用于构造测试数据路径

  file:
    max-entry: 1000  # 最大文件个数
    max-total-bytes: 209715200  #200L * 1024 * 1024

  pagination:
    default-page: 1 # 默认页码，从 1 开始
    default-size: 2 # 默认每页数量
    max-size: 100 # 单页允许查询的最大数量

  profile:
    recent-submission-size: 7 # 条
    frequency-of-repeated-submissions: 2 # 分钟

  submission:
    max-code-length: 2000 # 字符
    languages:
      - code: java11
        enabled: true
        display-name: Java 11
      - code: py3
        enabled: true
        display-name: Python 3

server:
  port: 8080

spring:
  application:
    name: goj-server

  servlet:
    multipart:  # 上传文件大小限制
      max-file-size: 50MB
      max-request-size: 52MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/goj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 200610

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10s  # 连接超时时间
      lettuce:
        pool:
          min-idle: 0  # 连接池中的最小空闲连接
          max-idle: 8  # 连接池中的最大空闲连接
          max-active: 8  # 连接池的最大数据库连接数
          max-wait: -1ms  # 连接池最大阻塞等待时间


# 日志配置
logging:
  level:
    com.gusl: debug
    org.springframework: warn


# mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl



# 配置 knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /**
      packages-to-scan:
        - com.gusl.gojserver.controller

security:
  token:
    secret: ${GOJ_JWT_SECRET}  # 从环境变量中读取
    expire-minutes: 120
    redis-prefix: "login:token:"


# 阿里云OSS相关配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: gusl
