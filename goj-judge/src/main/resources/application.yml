goj:
  judge:
    redis-consumer-enabled: false
    rocketmq:
      enabled: true
      topic: GOJ_JUDGE_TASK
      consumer-group: goj-judge-worker
    dispatch:
      slot-max-wait-time-ms: 100
      scan-interval: 2
    worker-name: worker-01  # 测评机代号
    data-root: D:\ProgramData\goj-data  # 数据根目录
    sandbox-base-url: http://192.168.100.128:5050  # 沙箱地址
    task:
      recovery-scan-ms: 30000  # 租约过期任务扫描间隔，单位毫秒
      retry-initial-delay-seconds: 10  # 重试间隔
      processing-timeout-minutes: 10  # 任务最长执行时间

    # 每项配置自动创建一个通用适配器，无需新增语言专属 Java 类。
    # 工具链必须已安装在沙箱中；server 端仍通过 submission.languages 控制可提交目录。
    # 当前启动时加载；以后配置中心可调用注册表 reload，完整校验后替换快照。
    languages:
      - code: java11
        source-file-name: Main.java
        need-compile: true
        active-file-name: Main.jar
        env:
          - PATH=/usr/local/java/jdk11/bin:/usr/bin:/bin
        # 保留原有的沙箱内编译、打包流程；命令来自管理员配置，不拼接用户源码。
        compile-args:
          - /bin/bash
          - -c
          - /usr/local/java/jdk11/bin/javac -encoding UTF-8 Main.java && /usr/local/java/jdk11/bin/jar -cf Main.jar *.class
        run-args:
          - /usr/local/java/jdk11/bin/java
          - -Dfile.encoding=UTF-8
          - -cp
          - /w/Main.jar
          - Main
        compile:
          cpu-limit-ms: 10000
          real-cpu-limit-ms: 30000
          memory-limit-kb: 524288
          stack-limit-kb: 131072
          proc-limit: 64
          stdout-limit-bytes: 16777216
          stderr-limit-bytes: 16777216
        run:
          clock-limit-multiplier: 3
          stack-limit-kb: 131072
          proc-limit: 64
          stdout-limit-bytes: 1048576
          stderr-limit-bytes: 16777216

      - code: py3
        source-file-name: Main.py
        need-compile: false
        env:
          - PYTHONIOENCODING=utf-8
        run-args:
          - /usr/bin/python3
          - /w/Main.py
        run:
          clock-limit-multiplier: 3
          stack-limit-kb: 131072
          proc-limit: 64
          stdout-limit-bytes: 1048576
          stderr-limit-bytes: 16777216





server:
  port: 8081

spring:
  application:
    name: goj-judge

  # springCloud相关配置
  cloud:
    openfeign:
      client:
        config:
          go-judge-sandbox:  # 设置沙箱的连接超时
            connect-timeout: 2000
            read-timeout: 30000
            logger-level: basic

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/goj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${GOJ_MYSQL_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10s  # 连接超时时间
      lettuce:
        pool:
          min-idle: 0   # 连接池中的最小空闲连接
          max-idle: 8  # 连接池中的最大空闲连接
          max-active: 8  # 连接池的最大数据库连接数
          max-wait: -1ms  # 连接池最大阻塞等待时间

# 日志配置
logging:
  level:
    com.gusl: debug
    com.gusl.gojjudge.task.mapper: warn
    com.gusl.gojjudge.judging.mapper: warn
    org.springframework: warn

# mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰映射
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


# 配置 knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /**
      packages-to-scan:
        - com.gusl.gojjudge.judging.web

rocketmq:
  name-server: 192.168.100.128:9876
